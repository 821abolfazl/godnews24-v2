name: GodNews24 Bot

on:
  # اجرای اصلی: یک سرویس زمان‌بندی بیرونی (cron-job.org) هر ۲۰ دقیقه این workflow رو صدا می‌زنه
  # (با mode=auto). زمان‌بندی خودِ گیت‌هاب دقیق نیست، پس اینجا فقط یک پشتیبانِ کم‌تکرار گذاشتم:
  # هر ۲ ساعت، دقیقه‌ی ۱۷ (به UTC؛ تهران = UTC+3:30)
  schedule:
    - cron: "17 5,7,9,11,13,15,17,19,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "manual = اجرای کامل دستی / auto = اجرای زمان‌بندی‌شده"
        default: "manual"

permissions:
  contents: write

concurrency:
  group: godnews-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # اگه یه اجرا گیر کرد، ساعت‌های رایگان هدر نره
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -q feedparser requests beautifulsoup4

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RUN_MODE: ${{ github.event.inputs.mode }}
          CHANNEL: "@GodNews24"
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "update posted" && git push)